{% block modal_title %}
    <h4 class="modal-title">{% if venue.get_venue_id %}Update{% else %}Add{% endif %} Venue</h4>
{% endblock %}

{% block modal_body %}
    <form id="venue_form">
        <input id="venue_id" name="venue_id" type="hidden" value="{{ venue.get_venue_id|default:"" }}"/>

        <div class="form-group">
            <label for="name" class="control-label">Venue Name</label>
            <input type="text" class="form-control" id="name" name="name" placeholder="Enter Venue Name" value="{{ venue.name }}">
        </div>

        <div class="form-group">
            <label for="description" class="control-label">Description</label>
            <textarea class="form-control" rows="5" id="description" name="description">{{ venue.description }}</textarea>
        </div>

        <div class="form-group">
            <label for="ampcs_address" class="control-label">AMPCS Address</label>
            <input type="text" class="form-control" id="ampcs_address" name="ampcs_address" value="{{ venue.ampcs_address }}">
        </div>

        <div class="form-group">
            <label for="sse_address" class="control-label">SSE Address</label>
            <input type="text" class="form-control" id="sse_address" name="sse_address" value="{{ venue.sse_address }}">
        </div>

        <div class="form-group">
            <label for="location" class="control-label">Location</label>
            <input type="text" class="form-control" id="location" name="location" value="{{ venue.location }}">
        </div>

        <div class="form-group">
            <label for="type" class="control-label">Type</label>
            <select id="type" name="type" class="form-control">
                <option value="">-= Select Type =-</option>
                {% for type in types %}
                    <option {% if type.1 == venue.get_type %}selected{% endif %} value="{{ type.1 }}">{{ type.1 }}</option>
                {% endfor %}
            </select>
        </div>

    </form>
{% endblock %}

{% block modal_footer %}
    <button class="btn btn-default pull-left">Cancel</button>
    <button class="btn btn-primary" data-data='{"venue_id":"{{ venue.get_venue_id }}"}' data-url="{% if venue.get_venue_id %}{% url 'update_venue' %}{% else %}{% url 'add_venue' %}{% endif %}" data-form-id="venue_form">
        {% if venue.get_venue_id %}Update{% else %}Create{% endif %} </button>
{% endblock %}
