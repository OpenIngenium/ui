{% load up_tools_tags %}
{% random_hash as unique_name %}
<div class="dynamic_element cmd_sse_element" id="{{ unique_name }}">
    <input type="hidden" name="row_id" value="{{ unique_name }}"/>
    <div class="row">
        <div class="col-xs-10">
            <label data-toggle="tooltip" title="SSE command string with arguments as would be entered into the SSE Command console."> Command String</label>
            <button type="button" class="btn btn-xs btn-info pull-right command-sse-lookup">
                <span class="glyphicon glyphicon-search"></span> Lookup
            </button>
            <input name="cmd_string" value="{{ entry.cmd_string|default:"" }}" type="text" class="form-control execution-input"/>
        </div>
        <div class="col-xs-2">
            <label>Timeout (Sec)</label>
            <input name="timeout" value="{{ entry.timeout|default:"" }}" type="number" class="form-control execution-input"/>
        </div>
    </div>
</div>
