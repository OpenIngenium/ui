{% extends 'ui/elements/executable/execution_result_container.html' %}
{% load ingenium_tags %}

{% block results %}
    <table class="table execution-results-table {% execution_result_status_css_class execution_record %}">
        <tr>
            <th>Data Path</th>
            <th>Session ID</th>
        </tr>
        {% for entry in execution_record.get_results.entries %}
            <tr>
                <td>{{ entry.data_path }}</td>
                <td>{{ entry.session_id }}</td>
            </tr>
        {% endfor %}
    </table>
{% endblock %}
