{% block step_content %}
    <form id="cmd_{{ element.get_element_id }}" class="cmd_form execution_form">
        <input type="hidden" name="element_id" value="{{ element.get_element_id }}">
        <input type="hidden" name="element_type_id" value="{{ element.get_element_type_id }}">
        <input type="hidden" name="execution_id" value="{{ execution_id|default_if_none:"" }}">
        <input type="hidden" name="procedure_id" value="{{ procedure_id|default_if_none:"" }}">

        <div class="row">
            <div class="col-xs-12">
                <label for="data_path_{{ element.get_element_id }}">Data Path</label>
                <input id="data_path_{{ element.get_element_id }}" name="data_path" value="{{ element.get_data_path|default:"" }}" type="text" class="form-control execution-input"/>
            </div>
        </div>

        <br />

        <div class="dynamic_elements cmd_elements">
            {% for entry in element.get_user_inputs.entries %}
                {% include "ui/elements/executable/cmd/cmd_element.html" %}
            {% empty %}
                {% include "ui/elements/executable/cmd/cmd_element.html" %}
            {% endfor %}
        </div>

    </form>
{% endblock %}

{% block javascript_content %}
    <script data-element-type-id="{{ element.get_element_type_id }}">

        {# resuable builder spawning #}
        function spawn_command_builder_ui(data) {
            let $builder_container = $('.cmd_builder_container');

            {# get the intial html in case we want to revert to initial state #}
            let initial_html = $builder_container.clone();

            $.ajax({
                beforeSend: function (xhr, settings) {
                    xhr.setRequestHeader("X-CSRFToken", '{{ csrf_token }}');
                    $builder_container.html('<div style="text-align: center; margin-top: 80px;"><h2>Loading Command...</h2></div>');
                },
                url: "{% url 'get_cmd_builder_html' %}",
                method: "POST",
                data: data,
                dataType: "JSON",
                success: function (result, status) {
                    $builder_container.html(result.html);
                },
                error: function (result, textStatus, errorThrown) {
                    {# if the error is 404 and we have an existing command string #}
                    {# then we tried to populate the builder with the existing command #}
                    {# but its not in the currently selected dictionary, show hidden error alert #}
                    if(result.status === 404 && data.command_string.length) {
                        $builder_container.html(initial_html);
                        $builder_container.find(".alert-danger").css("display", "block");
                    } else {
                        $builder_container.html('<div style="text-align: center; margin-top: 80px; color: #BA0C2F;"><h2>Error Loading Command Builder!</h2></div>');
                    }
                }
            });
        }

        $(document).on('up.added', '.cmd_form', function (event, element) {
            /* because we're listening to 'document' for up.added and then rely on event bubbling to alert us when an
             * $element was added to the document, we must make sure that the $element we get back is the same $element
             * that we're listening for, and not a child of the $element that we're listening for */
            if (this === element) {
                $(element).each(function (index, form) {
                    if (!$(form).data('cmd-initialized')) {
                        $(form).data('cmd-initialized', true);

                        var $form = $(form);

                        /* dynamic_element */
                        $form.children('.cmd_elements').dynamic_element({
                            url: "{% url 'cmd_data_row_html' %}",
                            data: {'element_type_id': '{{ element.get_element_type_id }}'}
                        }).on('dynamic_element.changed', function () {
                            $(this).closest('.cmd_form').trigger('change');
                        }).on('dynamic_element.initialized', function (event, wrapper, dynamic_elements) {
                            initialize_cmd_elements($(dynamic_elements));
                        }).on('dynamic_element.added', function (event, dynamic_element) {
                            initialize_cmd_elements($(dynamic_element));
                        });

                        ING.execution.change_step_form($form);

                        function cancel_typeahead_for_built_commands(event) {
                            /* check for existing command string */
                            let command_string = event.currentTarget.value;

                            /* if it contains a comma then its a built command and lookup results will always be none */
                            if(command_string.indexOf(",") > 0) {
                                /* hide the typeahed box in this case so user isn't interrupted, better if we could cancel event */
                                $(".twitter-typeahead .tt-open").hide();
                            }
                        }

                        function get_cmd_data() {
                            return {
                                'dictionary_type': 'FLIGHT',
                                'sse_dictionary_version': $('#sse_dictionary_version').val(),
                                'flight_dictionary_version': $('#flight_dictionary_version').val(),
                                'element_id': $form.find('input[name="element_id"]').val()
                            };
                        }

                        function initialize_cmd_elements($elements) {
                            $elements.each(function(i, element) {

                                /* initialize up_typeahead */
                                $(element).find('input[name="command"]').up_typeahead({
                                    url: '{% url 'lookup_cmd_names' %}',
                                    map_dict: {
                                        "name": "command_stem",
                                        "category": "operations_category",
                                        "description": "cmd_description"
                                    },
                                    typeahead_options: {
                                        highlight: false
                                    },
                                    typeahead_datasets: {
                                        templates: {
                                            suggestion: function (option) {
                                                return '<div class="step_typeahead_suggestion">' +
                                                    '<div>' +
                                                    '<h4>' + option.name + '</h4>' +
                                                    '<h4>' + option.category + '</h4>' +
                                                    '</div>' +
                                                    '<p>' + option.description + '</p>' +
                                                    '</div>';
                                            }
                                        }
                                    }
                                }).on('before_send', function () {
                                    $(this).up_typeahead('update_data', get_cmd_data());
                                }).on('typeahead:render', cancel_typeahead_for_built_commands)
                                  .on('typeahead:open', cancel_typeahead_for_built_commands);

                                /* initialize up_modal_request */
                                $(element).find('button.command-lookup').up_modal_request({
                                    url: '{% url 'lookup_cmd_modal' %}',
                                    up_modal_options: {
                                        size: 'lg',
                                        dismissible: false
                                    },
                                    first_ajax_request_before_ajax: function ($button) {
                                        let data = $.extend(true, get_cmd_data(), {
                                            'dynamic_element_id': $button.closest('.cmd_element').attr('id'),
                                            'command_string': $button.next(".twitter-typeahead").find('input[name="command"]').typeahead('val')
                                        });
                                        $button.up_modal_request('update_data', data);
                                    }
                                });

                            });
                        }
                    }
                });
            }
        });

        /* clicking 'Select' next to an argument in the modal, spawns the builder */
        $(document).on('up.added', 'button.select-cmd-button', function (event, element) {
            if (this === element) {
                /* attach listener to each 'Select' button in the wizard popup */
                $(element).each(function(index, button) {
                    let $button = $(button);

                    /* grab all the data we need for lookup and to pass the values back into the right element */
                    $(button).on('click', function () {
                        const data = {
                            element_id: $button.data('element-id'),
                            dynamic_element_id: $button.data('dynamic-element-id'),
                            command_stem: $button.data('cmd-stem'),
                            dictionary_type: $button.data('dictionary-type'),
                            dictionary_version: $button.data('dictionary-version'),
                        };

                        spawn_command_builder_ui(data);
                    });
                })
            }
        });

        $(document).on('up.added', 'button.details-cmd-button', function (event, element) {
            if (this === element) {
                /* attach listener to each 'Details' button in the wizard modal */
                $(element).each(function(index, button) {
                    let $button = $(button);
                    let $details_dropdown = $($button.next('.details-cmd-dropdown'));

                    /* grab the default loading html fragment for resetting */
                    let loading_html = $details_dropdown.find(".loading-indicator").clone();

                    $button.on('click', function(event) {
                        /* work around so dropdown displays inside modal */
                        let buttonCoords = $button.position();
                        $details_dropdown.css("top", buttonCoords.top + 33);
                        $details_dropdown.css("left", 0);

                        const data = {
                            element_id: $button.data('element-id'),
                            dynamic_element_id: $button.data('dynamic-element-id'),
                            cmd_stem: $button.data('cmd-stem'),
                            dictionary_type: $button.data('dictionary-type'),
                            dictionary_version: $button.data('dictionary-version'),
                        };

                        /* determine if user is opening or closing dropdown */
                        if($button.attr("aria-expanded") === "false") {
                            /* fetch template and replace dropdown with contents of template partial */
                             $.ajax({
                                beforeSend: function (xhr, settings) {
                                    xhr.setRequestHeader("X-CSRFToken", '{{ csrf_token }}');
                                },
                                url: "{% url 'get_cmd_details_html' %}",
                                method: "POST",
                                data: data,
                                dataType: "JSON",
                                success: function (result, status) {
                                    $details_dropdown.html(result.html);
                                },
                                error: function (result, textStatus, errorThrown) {
                                    $details_dropdown.html('<div style="text-align: center; margin-top: 15px;"><h2>Error Loading Details!</h2></div>');
                                }
                            });
                        } else {
                            /* reset contents back to loading state */
                            $details_dropdown.html(loading_html);
                        }
                    });
                })
            }
        });

        /* JS hooks for once the builder is available inside the modal */
        $(document).on('up.added', '.cmd_builder_component', function (event, element) {
            if (this === element) {
                let $builder_component = $(element);

                /*  grab state from data attributes so we can use it in JS */
                let element_id = $builder_component.data('element-id');
                let dynamic_element_id = $builder_component.data('dynamic-element-id');
                let existing_command_string = $builder_component.data('command-string');
                let dictionary_type = $builder_component.data('dictionary-type');
                let dictionary_version = $builder_component.data('dictionary-version');

                /* if we have an existing command string (built/entered) show and populate the builder UI with it */
                if(existing_command_string.length > 3) {
                    /* first element is the command stem */
                    const command_stem = existing_command_string.split(",", 1)[0];
                    const data = {
                        element_id: element_id,
                        dynamic_element_id: dynamic_element_id,
                        command_stem: command_stem,
                        command_string: existing_command_string,
                        dictionary_type: dictionary_type,
                        dictionary_version: dictionary_version,
                    };
                    spawn_command_builder_ui(data);
                }

                /* flatten form field values into (stem,arg,arg) */
                function flatten_builder_form_data(fieldsArray) {
                    /* grab command stem, only available after command was chosen */
                    let command_stem = $builder_component.find('input[name="command_string"]').data('command-stem');
                    let flatData = [command_stem];

                    fieldsArray.forEach(function(field) {
                        flatData.push(field.value);
                    });

                    return flatData.join();
                }

                let $builderSaveBtn = $(".cmd_builder_save_btn");
                /* another listener (not sure where) is being added to .btn buttons causing
                   the modal to be dismissed on click, this removes that listener */
                $builderSaveBtn.off("click");

                $builderSaveBtn.on("click", function(event) {
                    let $form = $(".cmd_builder_arguments_form");
                    let validForm = $form.data('formValidation').isValid();

                    /* if the form has not been validated yet, validate it */
                    if(validForm === null) {
                        $form.data('formValidation').validate();
                        validForm = $form.data('formValidation').isValid();
                    }

                    if(validForm === true) {
                        $.up_modal('hide');

                        /* grab builder form data and populate command string input field */
                        let formValues = $form.serializeArray();
                        let cmdString = flatten_builder_form_data(formValues);

                        $("form#cmd_" + element_id)
                            .find("#" + dynamic_element_id)
                            .find('input[name="command"]')
                            .typeahead('val', cmdString)
                            .end()
                            .trigger("change");
                    } else {
                        return false;
                    }
                });
            }
        });

    </script>
{% endblock %}
