{% block step_content %}
    <form id="wait_{{ element.get_element_id }}" class="wait_form execution_form">
        <input type="hidden" name="element_id" value="{{ element.get_element_id }}">
        <input type="hidden" name="element_type_id" value="{{ element.get_element_type_id }}">
        <input type="hidden" name="execution_id" value="{{ execution_id|default_if_none:"" }}">
        <input type="hidden" name="procedure_id" value="{{ procedure_id|default_if_none:"" }}">
        <div class="row">
            <div class="col-xs-4">
                <label>Wait Type</label>
            </div>
            <div class="col-xs-8">
                <label class="dynamic_time_value_label">Time Value</label>
            </div>
        </div>

        <div class="dynamic_elements wait_elements">
            {% for entry in element.get_user_inputs.entries %}
                {% include "ui/elements/executable/wait/wait_element.html" %}
            {% empty %}
                {% include "ui/elements/executable/wait/wait_element.html" %}
            {% endfor %}
        </div>
    </form>
{% endblock %}

{% block javascript_content %}
    <script data-element-type-id="{{ element.get_element_type_id }}">

        $(document).on('up.added', '.wait_form', function (event, element) {
            /* because we're listening to 'document' for up.added and then rely on event bubbling to alert us when an
             * $element was added to the document, we must make sure that the $element we get back is the same $element
             * that we're listening for, and not a child of the $element that we're listening for */
            if (this === element) {

                const time_labels = {
                    "DURATION": "Duration (sec)",
                    "UNTIL": "Time UTC - ISO or DOY Format"
                };

                $(element).each(function (index, form) {
                    if (!$(form).data('wait-initialized')) {
                        $(form).data('wait-initialized', true);

                        var $form = $(form);


                        /* dynamically set time label based on Wait Type value */
                        $form.find('select[name="wait_type"]').change(function(event) {
                            const dynamic_label = time_labels[event.target.value];
                            $form.find('.dynamic_time_value_label').text(dynamic_label);
                        }).trigger("change");

                        $form.formValidation({
                            framework: 'bootstrap',
                            fields: {
                                time_value: {
                                    validators: {
                                        notEmpty: {
                                            message: 'Must provide <strong>Time Value</strong>'
                                        }
                                    }
                                }
                            }
                        });
                        ING.execution.change_step_form($form);

                    }
                });
            }
        });

    </script>
{% endblock %}
