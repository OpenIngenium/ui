upstream ui {
    ip_hash;

    # Magic: Points to container in docker-compose
    server ui:5000;
}

upstream core_server {
    ip_hash;

    # Magic: Points to container in docker-compose
    server core_server:8080;
}

upstream dict_server {
    ip_hash;

    # Magic: Points to container in docker-compose
    server dict_service:5000;
}

upstream auth_service {
    ip_hash;

    # Magic: Points to container in docker-compose
    server auth_service:8080;
}

upstream execution_monitor {
   ip_hash;

   # Magic: Points to container in docker-compose
   server execution_monitor:3000;
}

# Configuration for Nginx Server
server {
    listen 8011;
    
    server_name *.jpl.nasa.gov;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    client_max_body_size 500M; 

    # Django Static Files (CSS, JS, Images, etc)
    location /static {
        autoindex on;

        # This is where the static folder lives on the Django Server
        alias /src/static;
    }

    # Django Media Files (Uploaded Files)
    location /media {
        autoindex on;

        # This is where the media folder lives on the Django Server
        alias /src/media;
    }

    location /core_server/ {
        resolver 137.78.160.9 137.78.160.19 valid=300s;
        resolver_timeout 10s;

        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_intercept_errors on;
        proxy_read_timeout 86400s;

        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_pass  http://core_server/;
    }
    

    location /report_server/ {
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_intercept_errors on;
        proxy_read_timeout 86400s;

        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_pass ${REPORT_API_URL}/;
    }    

    location /dict_server/ {
        resolver 137.78.160.9 137.78.160.19 valid=300s;
        resolver_timeout 10s;

        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_intercept_errors on;
        proxy_read_timeout 86400s;

        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_pass http://dict_server/;
    }

    location /auth_server/ {
        resolver 137.78.160.9 137.78.160.19 valid=300s;
        resolver_timeout 10s;

        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_intercept_errors on;
        proxy_read_timeout 86400s;

        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_pass http://auth_service/;
    }

    location /file_server_internal/ {
        internal;
        resolver 137.78.160.9 137.78.160.19 valid=300s;
        resolver_timeout 10s;

        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_intercept_errors on;
        proxy_read_timeout 86400s;

        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_pass ${FILE_SERVER_API_HOST};
    }

    location /search_server/ {
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_intercept_errors on;
        proxy_read_timeout 86400s;

        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_pass ${SEARCH_API_URL}/;
    }      

    location /execution_monitor/ {
        resolver 137.78.160.9 137.78.160.19 valid=300s;
        resolver_timeout 10s;
    
        proxy_http_version 1.1;        
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $host;

        proxy_pass http://execution_monitor/;
    }     

  # The proxy passes to the upstream web server defined in this file
    location / {
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $http_host;
        proxy_pass http://ui;
        proxy_redirect off;
        
        proxy_connect_timeout 300;
        proxy_send_timeout 300;
        proxy_read_timeout 300;
        send_timeout 300;
        
        keepalive_timeout 300;
    }
}
