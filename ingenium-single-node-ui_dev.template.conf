worker_processes  2;

error_log /dev/stdout info;
# error_log /dev/stdout debug;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    log_format ing_log_format '$remote_addr - $remote_user [$time_iso8601] ($request_time) '
                      '"$request" $status $body_bytes_sent '
                      '"$http_referer" "$http_user_agent"';

    access_log /dev/stdout ing_log_format;


    upstream django {
        server ${DJANGO_HOST};
    }

    upstream auth_service {
        server ${AUTH_API_HOST};
    }

    upstream core_server {
        server ${CORE_API_HOST};
    }

    upstream dict_server {
        server ${DICT_API_HOST}:443;
    }
    
    upstream report_server {
        server ${REPORT_SERVER_API_HOST};
    }

    upstream search_server {
        server ${SEARCH_SERVER_API_HOST};
    }

    upstream file_server {
        server ${FILE_SERVER_API_HOST};
    }

    upstream execution_monitor {
        server ${EXECUTION_MONITOR_API_HOST};
    }

    sendfile_max_chunk 512k;

    server {
        listen 80;

        client_max_body_size 500M; 

        location /auth_server/ {
            resolver 137.78.160.9 137.78.160.19 valid=300s;
            resolver_timeout 10s;

            proxy_http_version 1.1;
            proxy_buffering off;
            proxy_intercept_errors on;
            proxy_read_timeout 86400s;

            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_pass http://auth_service/;
        }

        location /core_server/ {
            resolver 137.78.160.9 137.78.160.19 valid=300s;
            resolver_timeout 10s;

            proxy_http_version 1.1;
            proxy_buffering off;
            proxy_intercept_errors on;
            proxy_read_timeout 86400s;
        

            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_pass http://core_server/;
        }

        location ~* ^/dict_server(.*) {
            resolver 137.78.160.9 137.78.160.19 valid=300s;
            resolver_timeout 10s;

            proxy_http_version 1.1;
            proxy_buffering off;
            proxy_intercept_errors on;
            proxy_read_timeout 86400s;

            rewrite_log on;

            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            #  Since the dictionary service is served by ui_nginx on CI, 
            # we need to keep "dict_server" path segment
            rewrite ^/dict_server(.*) /dict_server$1 break;

            # using the upstream dict_server defined above, this will be pointing to 
            # "https://ingenium-ci.jpl.nasa.gov/dict_server", which is served by another ui_nginx running in CI.
            # Must use "https" to get a 200 response. Note that "http://ingenium-ci.jpl.nasa.gov/dict_server" will return a 302 response
            # with redirect to https.
            # Note that "http://ingenium-ci.jpl.nasa.gov/dict_service" is serving up dictionary service through Docker Swarm'x proxy. 
            # Do not use it since it may be removed in near future.

            # Note that the ending slash should not be there for url rewrite
            proxy_pass https://dict_server;
        }
        
        location /report_server/ {
            resolver 137.78.160.9 137.78.160.19 valid=300s;
            resolver_timeout 10s;

            proxy_http_version 1.1;
            proxy_buffering off;
            proxy_intercept_errors on;
            proxy_read_timeout 86400s;

            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_pass http://report_server/;
        }        

        location /file_server_internal/ {
            internal;
            resolver 137.78.160.9 137.78.160.19 valid=300s;
            resolver_timeout 10s;

            proxy_http_version 1.1;
            proxy_buffering off;
            proxy_intercept_errors on;
            proxy_read_timeout 86400s;

            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_pass http://file_server/;
        }

        location /search_server/ {
            resolver 137.78.160.9 137.78.160.19 valid=300s;
            resolver_timeout 10s;

            proxy_http_version 1.1;
            proxy_buffering off;
            proxy_intercept_errors on;
            proxy_read_timeout 86400s;
    
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_pass http://search_server/;
        }   

        large_client_header_buffers 8 32k;

        location /execution_monitor/ {
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Host $host;

            proxy_buffers 8 32k;
            proxy_buffer_size 64k;
        
            proxy_http_version 1.1;        
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            proxy_pass http://execution_monitor/;
        }

        location / {
            proxy_pass http://django/;
        }
    }
}
