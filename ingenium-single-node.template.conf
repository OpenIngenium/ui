worker_processes  1;

error_log /dev/stdout info;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    log_format ing_log_format '$remote_addr - $remote_user [$time_iso8601] ($request_time) '
                      '"$request" $status $body_bytes_sent '
                      '"$http_referer" "$http_user_agent"';

    access_log /dev/stdout ing_log_format;

    upstream django {
        server ${DJANGO_HOST};
    }

    upstream core_server {
        server ${CORE_API_HOST};
    }

    upstream dict_server {
        server ${DICT_API_HOST};
    }

    upstream auth_service {
        server ${AUTH_API_HOST};
    }
    
    upstream file_server {
        server ${FILE_SERVER_API_HOST};
    }    

    upstream execution_monitor {
        server ${EXECUTION_MONITOR_API_HOST};
    }    

    server {
        listen 80;

        client_max_body_size 500M;

        location /auth_server/ {
            resolver 137.78.160.9 137.78.160.19 valid=300s;
            resolver_timeout 10s;

            proxy_http_version 1.1;
            proxy_buffering off;
            proxy_intercept_errors on;
            proxy_read_timeout 86400s;

            add_header 'Access-Control-Allow-Origin' '*';
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_pass http://auth_service/;
        }

        location /core_server/ {
            resolver 137.78.160.9 137.78.160.19 valid=300s;
            resolver_timeout 10s;

            proxy_http_version 1.1;
            proxy_buffering off;
            proxy_intercept_errors on;
            proxy_read_timeout 86400s;

            add_header 'Access-Control-Allow-Origin' '*';
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_pass  http://core_server/;
        }

        location /dict_server/ {
            resolver 137.78.160.9 137.78.160.19 valid=300s;
            resolver_timeout 10s;

            proxy_http_version 1.1;
            proxy_buffering off;
            proxy_intercept_errors on;
            proxy_read_timeout 86400s;

            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_pass http://dict_server/;
        }
        
        location /report_server/ {
            proxy_http_version 1.1;
            proxy_buffering off;
            proxy_intercept_errors on;
            proxy_read_timeout 86400s;

            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_pass ${REPORT_API_URL}/;
        }        

        location /file_server_internal/ {
            internal;
            resolver 137.78.160.9 137.78.160.19 valid=300s;
            resolver_timeout 10s;

            proxy_http_version 1.1;
            proxy_buffering off;
            proxy_intercept_errors on;
            proxy_read_timeout 86400s;

            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_pass http://file_server/;
        }

        location /search_server/ {
            proxy_http_version 1.1;
            proxy_buffering off;
            proxy_intercept_errors on;
            proxy_read_timeout 86400s;

            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_pass ${SEARCH_API_URL}/;
        } 

        location /execution_monitor/ {
            resolver 137.78.160.9 137.78.160.19 valid=300s;
            resolver_timeout 10s;
        
            proxy_http_version 1.1;        
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Host $host;

            proxy_pass http://execution_monitor/;
        }        

        location /static {
            autoindex off;
            include /etc/nginx/mime.types;
            # This is where the static folder lives in the nginx container
            root /;
        }

        location / {
            proxy_pass http://django/;
        }
    }
}
