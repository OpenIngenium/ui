upstream ui {
    ip_hash;

    # Magic: Points to container in docker-compose
    server ui:5000;
}

upstream core_server {
    ip_hash;

    # Magic: Points to container in docker-compose
    server core_server:8080;
}

upstream dict_server {
    ip_hash;

    # Magic: Points to container in docker-compose
    server dict_service:5000;
}

upstream auth_service {
    ip_hash;

    # Magic: Points to container in docker-compose
    server auth_service:8080;
}

upstream execution_monitor {
   ip_hash;

   # Magic: Points to container in docker-compose
   server execution_monitor:3000;
}

upstream fileservering {
   ip_hash;

   # Magic: Points to container in docker-compose
   server fileservering:9000;
}

upstream arangodb_archive {
    ip_hash;

    # Magic: Points to container in docker-compose
    server arangodb_archive:8529;
}

# Configuration for Nginx Server

server {
    listen 443 ssl;

    server_name _; # catch-all: matches any domain this server is reached by
    ssl_certificate /etc/nginx/ssl/ing_https.crt;
    ssl_certificate_key /etc/nginx/ssl/ing_https.key;
    # SSL/TLS configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    client_max_body_size 2G; 

    location /core_server/ {
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_intercept_errors on;
        proxy_read_timeout 86400s;

        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_pass  http://core_server/;
    }

    location /report_server/ {
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_intercept_errors on;
        proxy_read_timeout 86400s;

        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_pass ${REPORT_API_URL}/;
    }    

    location /dict_server/ {
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_intercept_errors on;
        proxy_read_timeout 86400s;

        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_pass http://dict_server/;
    }

    location /auth_server/ {
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_intercept_errors on;
        proxy_read_timeout 86400s;

        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_pass http://auth_service/;
    }

    location /minio/ {
        # Restrict to internal callers only (e.g. report_server's signed PUT uploads -
        # FILE_SERVER_API_HOST points here in some deployments). MinIO's bucket policy grants
        # anonymous s3:GetObject, so without this, any client on the public internet can GET
        # any file here with no login/signature required, bypassing the /file_server auth gate.
        # ING_ANALYTICS_IP is substituted at container startup by eval_file_prod.sh (envsubst) -
        # set it to report_server's source IP/subnet in the deployment's docker-compose env.
        allow ${ING_ANALYTICS_IP};
        deny all;

        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_intercept_errors on;
        proxy_read_timeout 86400s;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Date $http_date;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Content-Type $http_content_type;
        proxy_set_header Content-Length $http_content_length;
        
        rewrite ^/minio/(.*)$ /$1 break;
        # This is crucial to rewrite the URL path properly

        proxy_pass http://fileservering;
    }

    # Internal-only target of the X-Accel-Redirect issued by
    # src/server/src/routes/fileServer.js - unreachable directly by clients. There is
    # deliberately no plain "location /file_server/" here: public requests to
    # /file_server/<path> fall through to the catch-all "location /" below, which proxies
    # to the ui/Express app, where loginRequired enforces a valid session before
    # routes/fileServer.js redirects (via X-Accel-Redirect) back into this location.
    location /file_server_internal/ {
        internal;

        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_intercept_errors on;
        proxy_read_timeout 86400s;

        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_pass http://fileservering/;
    }

    location /search_server/ {
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_intercept_errors on;
        proxy_read_timeout 86400s;

        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_pass ${SEARCH_API_URL}/;
    }     

    # This is used for Arango DB replication and web UI view
    location ~ ^/(_db|_api|_admin|_open) {
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_intercept_errors on;
        proxy_read_timeout 86400s;

        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # No trailing slash to pass the original uri
        proxy_pass http://arangodb_archive;
    }

    location /execution_monitor/ {
        proxy_http_version 1.1;        
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $host;

        # Long-lived WebSocket connection - without this, Nginx's default 60s
        # proxy_read_timeout is too close to socket.io's ~35s ping interval and
        # intermittently kills idle connections ("transport close" disconnects).
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;

        proxy_pass http://execution_monitor/;
    }     

  # The proxy passes to the upstream web server defined in this file
    location / {
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $http_host;
        proxy_pass http://ui;
        proxy_redirect off;

        proxy_connect_timeout 300;
        proxy_send_timeout 300;
        proxy_read_timeout 300;
        send_timeout 300;

        keepalive_timeout 300;
    }
}